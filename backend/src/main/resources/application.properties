# ============================================================
# Database Configuration
# In production set DATABASE_URL, DB_USERNAME, DB_PASSWORD
# In development the defaults below connect to local PostgreSQL
# ============================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ferremas_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server Port
server.port=${PORT:8081}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}

# JWT
# Override JWT_SECRET outside source control for production.
jwt.secret=${JWT_SECRET:dev_local_jwt_secret_change_me_32_chars_minimum_2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS - comma-separated list of allowed origins/patterns
# Example production value: https://mi-ferreteria.vercel.app,https://www.mi-ferreteria.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,https://proyecto-curso-integrador-frontend.vercel.app}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,https://proyecto-curso-integrador-frontend.vercel.app,https://proyecto-curso-integrador-frontend-*.vercel.app}

# Customer lookup.
# DNI uses APIDNI. RUC uses local SUNAT Padron Reducido records.
customer.lookup.enabled=${CUSTOMER_LOOKUP_ENABLED:true}
customer.lookup.provider=${CUSTOMER_LOOKUP_PROVIDER:APIDNI}
customer.lookup.token=${CUSTOMER_LOOKUP_TOKEN:}
customer.lookup.dni-url=${CUSTOMER_LOOKUP_DNI_URL:https://apidni.com/api/v2/dni/{document}}
customer.lookup.ruc-url=

# SUNAT official reduced RUC registry.
sunat.ruc.padron-url=${SUNAT_RUC_PADRON_URL:https://www2.sunat.gob.pe/padron_reducido_ruc.zip}
