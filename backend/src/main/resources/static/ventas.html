<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEPS GROUP PERÚ - Punto de Venta</title>
    <link rel="stylesheet" href="css/meps.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="sidebar">
        <div class="logo">MEPS GROUP PERÚ</div>
        <ul class="nav-links">
            <li class="nav-item" onclick="location.href='index.html'" style="cursor:pointer">
                <i class="fas fa-th-large"></i><span>Dashboard</span>
            </li>
            <li class="nav-item active" onclick="location.href='ventas.html'" style="cursor:pointer">
                <i class="fas fa-cash-register"></i><span>Ventas</span>
            </li>
            <li class="nav-item" onclick="location.href='inventario.html'" style="cursor:pointer">
                <i class="fas fa-box"></i><span>Inventario</span>
            </li>
            <li class="nav-item" onclick="location.href='pedidos.html'" style="cursor:pointer">
                <i class="fas fa-shopping-cart"></i><span>Pedidos</span>
            </li>
            <li class="nav-item" onclick="location.href='clientes.html'" style="cursor:pointer">
                <i class="fas fa-users"></i><span>Clientes</span>
            </li>
            <li class="nav-item" onclick="location.href='proveedores.html'" style="cursor:pointer">
                <i class="fas fa-truck"></i><span>Proveedores</span>
            </li>
            <li class="nav-item" onclick="location.href='personal.html'" style="cursor:pointer">
                <i class="fas fa-user-tie"></i><span>RRHH y Usuarios</span>
            </li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="location.reload();">NUEVA VENTA</button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">ADMIN USUARIO</span>
                        <span class="user-role">SUPER ADMIN</span>
                    </div>
                    <i class="far fa-user-circle user-icon"></i>
                </div>
            </div>
        </header>

        <main class="content" style="padding: 1.5rem; height: calc(100vh - 70px); display: flex; flex-direction: column;">
            
            <div style="display: grid; grid-template-columns: 1fr 350px; gap: 1.5rem; flex: 1; overflow: hidden;">
                
                <!-- LEFT SIDE: PRODUCTS -->
                <div style="display: flex; flex-direction: column; overflow: hidden;">
                    <!-- Search Bar -->
                    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                        <div style="position: relative; flex: 1;">
                            <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                            <input type="text" id="searchInput" class="form-control" placeholder="Buscar producto ..." style="padding-left: 2.5rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; height: 42px;">
                        </div>
                        <button class="btn btn-primary" style="border-radius: 4px; padding: 0 1.5rem; font-weight: 700;">BUSCAR</button>
                    </div>

                    <!-- Products Grid -->
                    <div id="products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.25rem; overflow-y: auto; padding-right: 0.5rem; padding-bottom: 2rem;">
                        <!-- Product cards will be injected here by JS -->
                    </div>
                </div>

                <!-- RIGHT SIDE: CHECKOUT PANEL -->
                <div style="display: flex; flex-direction: column; gap: 1.5rem; overflow: hidden;">
                    
                    <!-- Customer Identification -->
                    <div style="background: white; border: 1px solid var(--border-color); border-radius: 4px; padding: 1.25rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                            <span style="font-size: 0.7rem; font-weight: 800; color: var(--text-main);">IDENTIFICACIÓN CLIENTE</span>
                            <select id="s_user" style="font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border-color); max-width: 100px;">
                                <option value="">Cajero...</option>
                            </select>
                        </div>
                        
                        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                            <input type="text" id="s_customer_doc" class="form-control" placeholder="DNI o RUC" style="background: #f8fafc; border-radius: 4px; flex: 1; height: 38px;">
                            <button id="btn-validate-customer" class="btn btn-primary" style="border-radius: 4px; padding: 0 1rem; font-size: 0.8rem;">VALIDAR</button>
                        </div>
                        
                        <!-- Customer validated badge -->
                        <div id="customer-badge" style="background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 4px; padding: 0.75rem; display: none; align-items: flex-start; gap: 0.75rem;">
                            <div style="background: var(--primary-blue); color: white; padding: 0.25rem 0.4rem; border-radius: 4px; font-size: 0.65rem; font-weight: 800; line-height: 1;" id="customer-type-badge">RUC</div>
                            <div>
                                <div id="customer-name-display" style="font-size: 0.75rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 0.2rem;"></div>
                                <div style="font-size: 0.65rem; color: var(--text-muted);"><span id="customer-doc-display"></span> • Habido / Activo</div>
                            </div>
                        </div>
                        <input type="hidden" id="s_customer_id" value="">
                    </div>

                    <!-- Cart -->
                    <div style="background: white; border: 1px solid var(--border-color); border-radius: 4px; display: flex; flex-direction: column; flex: 1; overflow: hidden; background: #f8fafc;">
                        
                        <div style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: #e2e8f0;">
                            <div style="font-weight: 800; font-size: 0.9rem; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem;">
                                <i class="fas fa-shopping-cart" style="color: var(--primary-blue);"></i> CARRITO
                            </div>
                            <button id="btn-clear-cart" style="background: white; color: #ef4444; border: 1px solid #fca5a5; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center;">
                                <i class="far fa-trash-alt"></i>
                            </button>
                        </div>

                        <div id="cart-items" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">
                            <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 2rem;">El carrito está vacío.</div>
                        </div>

                        <div style="padding: 1.5rem; background: white; border-top: 1px solid var(--border-color);">
                            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem;">
                                <span style="font-weight: 900; font-size: 1.1rem;">TOTAL</span>
                                <span id="cart-total" style="font-weight: 900; font-size: 1.4rem; color: var(--primary-blue);">S/ 0.00</span>
                            </div>
                            <button id="btn-checkout" style="background: #f97316; color: white; width: 100%; border: none; padding: 1rem; border-radius: 4px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: background 0.2s;">
                                CONFIRMAR VENTA
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Hidden standard inputs for document type and payment to keep JS logic simple without cluttering UI -->
    <input type="hidden" id="s_doc_type" value="BOLETA">
    <input type="hidden" id="s_payment" value="EFECTIVO">

    <script type="module" src="js/sales.js"></script>
</body>
</html>
